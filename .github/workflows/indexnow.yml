name: IndexNow (Bing + Yandex)
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: "Submit every URL in sitemap.xml"
        default: "true"
jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for GitHub Pages to publish
        run: sleep 120
      - name: Submit to IndexNow
        env:
          BEFORE: ${{ github.event.before }}
          MSG: ${{ github.event.head_commit.message }}
          ALL: ${{ github.event.inputs.all }}
        run: python3 .github/indexnow.py
